[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-manager"
version = "0.1.0"
description = "Bank accounts accounting system - Professional Python laboratory project"
requires-python = ">=3.11"
authors = [{ name = "Liubomyr Pylypchuk" }]

[project.scripts]
bank-manager = "bank_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]
